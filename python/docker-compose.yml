
services:
  app:
    build: .
    container_name: app
    ports:
      - "${APP_PORT}:${APP_PORT}"
    command: uvicorn app.main:app --host 0.0.0.0 --port ${APP_PORT}
    depends_on:
      cache:
        condition: service_healthy

  cache:
    image: redis:7
    container_name: cache
    expose:
      - "${CACHE_PORT}"
    command: ["redis-server", "--port", "${CACHE_PORT}"]
    volumes:
      - "cache_data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${CACHE_PORT}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cache_data:
